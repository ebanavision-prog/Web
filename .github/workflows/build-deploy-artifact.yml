name: Build deploy artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          DATABASE_URL: "mysql://placeholder:placeholder@localhost:3306/placeholder"
          AUTH_SECRET: "placeholder-build-time-secret-not-used-at-runtime"
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "placeholder-build-time-key-not-used-at-runtime"
          NEXT_PUBLIC_SITE_URL: "https://ebanavision.com"
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: Publish to deploy/standalone branch
        run: |
          cd .next/standalone
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b deploy/standalone
          git add -A
          git commit -q -m "Deploy artifact from ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy/standalone:deploy/standalone
